<!DOCTYPE html>
<html>
<head>
  <!--

    The path provided below has to start and end with a slash "/" in order for

    This is a placeholder for base href that will be replaced by the value of

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="gothalo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>gothalo</title>
  <link rel="manifest" href="manifest.json">

  <!-- mobile_scanner 7.4.0's web stop() drops its MediaStream reference without
       stopping the tracks, so the camera (and iOS's indicator) stays on for the
       life of the page. Remember every stream getUserMedia hands out so the app
       can force-stop the tracks when the scanner goes away. -->
  <script>
    (function () {
      var streams = [];
      var orig = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia = function (constraints) {
        return orig(constraints).then(function (stream) {
          streams.push(stream);
          return stream;
        });
      };
      window.__stopCameraStreams = function () {
        streams.forEach(function (s) {
          s.getTracks().forEach(function (t) { t.stop(); });
        });
        streams = [];
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
