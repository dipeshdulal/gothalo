name: public-hygiene

# Keeps per-install secrets and personal identifiers out of tracked source.
#
# Deliberately pattern-based, not a list of names: a blocklist naming the
# things it protects would publish them itself.
on: [push, pull_request]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Firebase real configs must stay untracked
        run: |
          set -e
          for f in app/android/app/google-services.json \
                   app/lib/core/firebase_web_options.dart \
                   internal/web/assets/firebase-messaging-sw.js \
                   internal/web/assets/push-test.html; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "$f is tracked — only its .example may be committed"; exit 1
            fi
          done
          echo "real firebase configs are untracked"

      - name: Firebase .example templates must stay placeholders
        run: |
          set -e
          grep -q "YOUR_PROJECT_ID" app/android/app/google-services.json.example
          grep -q "YOUR_WEB_API_KEY" app/lib/core/firebase_web_options.dart.example
          grep -q "YOUR_VAPID_PUBLIC_KEY" app/lib/core/firebase_web_options.dart.example
          grep -q "YOUR_PROJECT_ID" internal/web/assets/firebase-messaging-sw.js.example
          grep -q "YOUR_VAPID_PUBLIC_KEY" internal/web/assets/push-test.html.example
          echo "firebase templates are unconfigured placeholders"

      - name: No live credentials or personal hosts
        run: |
          set -e
          # Google API keys, private keys, and real tailnet hostnames. Fixture
          # hosts are <host>.<tailnet>.ts.net / example.ts.net / host.ts.net.
          hits=$(git grep -nE \
            "AIza[0-9A-Za-z_-]{35}|BEGIN [A-Z ]*PRIVATE KEY|\"private_key\"[[:space:]]*:[[:space:]]*\"-----" \
            -- . ':!*_test.go' ':!internal/push/creds.go' || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "^ live credential material"; exit 1; fi

          hosts=$(git grep -nEo "[a-z0-9-]+\.tail[a-z0-9]+\.ts\.net" -- . || true)
          if [ -n "$hosts" ]; then echo "$hosts"; echo "^ real tailnet hostname"; exit 1; fi
          echo "no credentials or personal hosts"

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
